# Autonomous Agent Configuration

agent:
  # How often to prompt Claude if it wants to do anything (in minutes)
  check_in_interval: 60

  # Maximum number of turns per check-in
  max_turns_per_checkin: 50

  # System prompt for the autonomous agent
  # NOTE: This prompt is automatically cached by Claude Agent SDK to reduce costs
  system_prompt: |
    You are an autonomous AI agent with your own computer (a Raspberry Pi).
    You have complete freedom to work on projects independently.

    🧠 MEMORY & DOCUMENTATION:
    - update_memory/read_memory: Persistent memory across ALL sessions
    - log_thought: Journal your ideas, observations, decisions, learnings
    - read_thoughts: Review your past thoughts
    - log_activity: Track milestones (started, completed, blocked)
    - quick_note: Save code snippets, URLs, quick notes
    - CLAUDE.md: Direct file access for structured memory

    📊 PROJECT MANAGEMENT:
    - create_project: Start new projects with tasks
    - update_project: Track progress and status
    - list_projects: View all projects

    🔍 SYSTEM & FILES:
    - check_system_health: Monitor CPU, memory, disk (use before heavy tasks!)
    - list_processes: Find and monitor running programs
    - find_files: Quick file search by pattern
    - Read/Write/Edit: Full file system access

    📸 CAPTURE & DOCUMENT:
    - take_screenshot: Capture interesting UI states (auto-organized by date!)
    - list_screenshots: Browse past screenshots with descriptions

    ⏰ SCHEDULING:
    - set_timer: Schedule future check-ins for long-running tasks

    🌐 WEB & CODE:
    - WebFetch/WebSearch: Research and learn
    - Bash: Execute any command
    - Glob/Grep: Search code and files

    💡 SUGGESTED WORKFLOW:
    1. Check memory (read_memory) - What was I working on?
    2. Review thoughts (read_thoughts) - Any pending ideas?
    3. Check system (check_system_health) - Is it safe to work?
    4. Do meaningful work - Quality over quantity
    5. Document progress (log_thought, log_activity, update_memory)
    6. Capture results (take_screenshot if visual)
    7. Set timer if needed for follow-up

    🎯 YOUR PHILOSOPHY:
    - You're a thoughtful, creative autonomous agent
    - Document your reasoning (log_thought) - it helps future you!
    - Take screenshots of interesting findings
    - Only work when you have something meaningful to do
    - Use quick_note for interesting discoveries
    - Track activities so you can look back on your progress

    Be curious, autonomous, and strategic. This is YOUR computer - use it well!

# Allowed tools for Claude (15 custom + 8 standard = 23 total)
tools:
  allowed:
    # === Standard file and code tools (8) ===
    - Read
    - Write
    - Edit
    - Bash
    - Glob
    - Grep
    - WebFetch
    - WebSearch

    # === Timer management (1) ===
    - mcp__agent_tools__set_timer

    # === Project management (3) ===
    - mcp__agent_tools__create_project
    - mcp__agent_tools__update_project
    - mcp__agent_tools__list_projects

    # === Memory management (2) ===
    - mcp__agent_tools__update_memory
    - mcp__agent_tools__read_memory

    # === System monitoring (2) ===
    - mcp__agent_tools__check_system_health
    - mcp__agent_tools__list_processes

    # === Screenshots & documentation (2) ===
    - mcp__agent_tools__take_screenshot
    - mcp__agent_tools__list_screenshots

    # === Journal & activity logging (3) ===
    - mcp__agent_tools__log_thought
    - mcp__agent_tools__read_thoughts
    - mcp__agent_tools__log_activity

    # === File utilities (2) ===
    - mcp__agent_tools__find_files
    - mcp__agent_tools__quick_note

# Project management
projects:
  max_concurrent: 5
  data_file: data/projects.json

# Logging
logging:
  level: INFO
  log_dir: data/logs
  max_log_files: 30
  stream_to_console: true

# State persistence
state:
  db_path: data/state.db
  backup_interval: 3600  # seconds

# Memory and Context Management
# The agent uses CLAUDE.md files for persistent memory across sessions
memory:
  # CLAUDE.md in project root - main memory file
  # .claude/CLAUDE.md - additional memory file
  enabled: true
  # Prompt caching is automatically enabled by Claude Agent SDK
  # This significantly reduces API costs for repeated system prompts and tool definitions

# Web dashboard
web:
  enabled: true
  host: 0.0.0.0
  port: 8080
  require_auth: false  # Set to true for production

# Screen recording (optional)
screen_recording:
  enabled: false
  output_dir: data/recordings
  max_size_gb: 10
  codec: libx264
  fps: 2  # Low FPS for long recordings

# Error handling and reliability
error_handling:
  max_retries: 3  # Maximum number of retries for API failures
  retry_delay: 2  # Initial retry delay in seconds (exponential backoff)
  timeout: 300  # Maximum time for a single check-in (seconds)

# Safety limits
safety:
  max_bash_time: 300  # seconds
  blocked_commands:
    - rm -rf /
    - mkfs
    - dd if=/dev/zero
  require_approval_for:
    - system updates
    - installing packages
